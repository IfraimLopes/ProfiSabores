
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar palavra-passe - Restaurante Profitecla</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                180deg,
                #b3daff 0%,
                #ffffff 65%
            );
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 24px;
            padding: 35px 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            color: #222;
            margin-bottom: 10px;
        }

        .descricao {
            text-align: center;
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input {
            width: 100%;
            height: 54px;
            border: 1px solid #ddd;
            border-radius: 14px;
            padding: 0 16px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #8bc2f5;
            box-shadow: 0 0 0 3px rgba(139, 194, 245, 0.18);
        }

        button {
            width: 100%;
            min-height: 54px;
            margin-top: 4px;
            border: none;
            border-radius: 14px;
            background: #8bc2f5;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #6eafe9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #mensagem {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        #mensagem.sucesso {
            display: block;
            background: #e5f7e9;
            color: #237a35;
        }

        #mensagem.erro {
            display: block;
            background: #ffe5e5;
            color: #c62828;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #2684d9;
            text-decoration: none;
            font-size: 14px;
        }

        .voltar:hover {
            text-decoration: underline;
        }

        .campo-email {
            background: #f5f5f5;
            color: #555;
        }

        .secao {
            display: none;
        }

        .secao.ativa {
            display: block;
        }

        .secao form {
            margin-top: 20px;
        }

        .botao-secundario {
            background: #eaf4ff;
            color: #2684d9;
            margin-top: 8px;
        }

        .botao-secundario:hover {
            background: #d8ebff;
        }

        .requisitos {
            color: #777;
            font-size: 12px;
            line-height: 1.5;
            margin-top: -5px;
        }
    </style>
</head>

<body>

<main class="container">

    <div class="logo">
        <img
            src="/static/img/profiteclaICON.png"
            alt="Profitecla"
        >
    </div>

    <h1 id="titulo">Recuperar palavra-passe</h1>

    <p class="descricao" id="descricao">
        Introduza o seu e-mail. Enviaremos um código para recuperar a sua palavra-passe.
    </p>

    <!-- ETAPA 1: PEDIR CÓDIGO -->
    <section class="secao ativa" id="etapaEmail">

        <form id="formEmail">

            <input
                type="email"
                id="email"
                placeholder="E-mail"
                autocomplete="email"
                aria-label="E-mail"
                required
            >

            <button type="submit" id="botaoEmail">
                Enviar código
            </button>

        </form>

    </section>

    <!-- ETAPA 2: CÓDIGO E NOVA PALAVRA-PASSE -->
    <section class="secao" id="etapaNovaPassword">

        <form id="formNovaPassword">

            <input
                type="email"
                id="emailConfirmacao"
                class="campo-email"
                aria-label="E-mail da recuperação"
                readonly
            >

            <input
                type="text"
                id="codigo"
                placeholder="Código de 6 dígitos"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="6"
                pattern="[0-9]{6}"
                aria-label="Código de recuperação"
                required
            >

            <input
                type="password"
                id="novaPassword"
                placeholder="Nova palavra-passe"
                autocomplete="new-password"
                aria-label="Nova palavra-passe"
                required
            >

            <p class="requisitos">
                Escolha uma palavra-passe segura que cumpra os requisitos apresentados pelo sistema.
            </p>

            <input
                type="password"
                id="confirmarPassword"
                placeholder="Confirmar nova palavra-passe"
                autocomplete="new-password"
                aria-label="Confirmar nova palavra-passe"
                required
            >

            <button type="submit" id="botaoAlterar">
                Alterar palavra-passe
            </button>

            <button
                type="button"
                class="botao-secundario"
                id="botaoVoltar"
            >
                Voltar
            </button>

        </form>

    </section>

    <div id="mensagem" role="status" aria-live="polite"></div>

    <a href="/utilizadores/login/" class="voltar">
        Voltar para o login
    </a>

</main>

<script>
    const formEmail = document.getElementById("formEmail");
    const formNovaPassword = document.getElementById("formNovaPassword");

    const emailInput = document.getElementById("email");
    const emailConfirmacao = document.getElementById("emailConfirmacao");
    const codigoInput = document.getElementById("codigo");
    const novaPasswordInput = document.getElementById("novaPassword");
    const confirmarPasswordInput = document.getElementById("confirmarPassword");

    const botaoEmail = document.getElementById("botaoEmail");
    const botaoAlterar = document.getElementById("botaoAlterar");
    const botaoVoltar = document.getElementById("botaoVoltar");

    const mensagem = document.getElementById("mensagem");
    const titulo = document.getElementById("titulo");
    const descricao = document.getElementById("descricao");

    const etapaEmail = document.getElementById("etapaEmail");
    const etapaNovaPassword = document.getElementById("etapaNovaPassword");

    let emailRecuperacao = "";

    function mostrarMensagem(texto, tipo) {
        mensagem.textContent = texto;
        mensagem.className = tipo;
    }

    function limparMensagem() {
        mensagem.textContent = "";
        mensagem.className = "";
    }

    function mostrarEtapaCodigo() {
        etapaEmail.classList.remove("ativa");
        etapaNovaPassword.classList.add("ativa");

        titulo.textContent = "Definir nova palavra-passe";
        descricao.textContent =
            "Introduza o código recebido por e-mail e escolha uma nova palavra-passe.";

        emailConfirmacao.value = emailRecuperacao;
        codigoInput.focus();
    }

    function voltarEtapaEmail() {
        etapaNovaPassword.classList.remove("ativa");
        etapaEmail.classList.add("ativa");

        titulo.textContent = "Recuperar palavra-passe";
        descricao.textContent =
            "Introduza o seu e-mail. Enviaremos um código para recuperar a sua palavra-passe.";

        limparMensagem();
        emailInput.focus();
    }

    async function lerResposta(resposta) {
        let resultado;

        try {
            resultado = await resposta.json();
        } catch {
            throw new Error("O servidor devolveu uma resposta inválida.");
        }

        if (!resposta.ok) {
            const erro = resultado.erro;

            throw new Error(
                Array.isArray(erro)
                    ? erro.join(" ")
                    : erro || "Ocorreu um erro. Tente novamente."
            );
        }

        return resultado;
    }

    // ETAPA 1: pedir o PIN
    formEmail.addEventListener("submit", async (event) => {
        event.preventDefault();
        limparMensagem();

        emailRecuperacao = emailInput.value.trim().toLowerCase();

        if (!emailRecuperacao) {
            mostrarMensagem("Introduza o seu e-mail.", "erro");
            return;
        }

        botaoEmail.disabled = true;
        botaoEmail.textContent = "A enviar código...";

        const dados = new FormData();
        dados.append("email", emailRecuperacao);

        try {
            const resposta = await fetch(
                "/utilizadores/api/recuperar-password/",
                {
                    method: "POST",
                    body: dados
                }
            );

            const resultado = await lerResposta(resposta);

            mostrarEtapaCodigo();

            mostrarMensagem(
                resultado.mensagem ||
                "Se o e-mail estiver registado, receberá um código de recuperação.",
                "sucesso"
            );

        } catch (erro) {
            mostrarMensagem(erro.message, "erro");

        } finally {
            botaoEmail.disabled = false;
            botaoEmail.textContent = "Enviar código";
        }
    });

    // ETAPA 2: validar PIN e definir nova palavra-passe
    formNovaPassword.addEventListener("submit", async (event) => {
        event.preventDefault();
        limparMensagem();

        const codigo = codigoInput.value.trim();
        const novaPassword = novaPasswordInput.value;
        const confirmarPassword = confirmarPasswordInput.value;

        if (!/^\d{6}$/.test(codigo)) {
            mostrarMensagem(
                "Introduza um código válido de 6 dígitos.",
                "erro"
            );
            return;
        }

        if (novaPassword !== confirmarPassword) {
            mostrarMensagem(
                "As palavras-passe não coincidem.",
                "erro"
            );
            return;
        }

        botaoAlterar.disabled = true;
        botaoAlterar.textContent = "A alterar palavra-passe...";

        const dados = new FormData();
        dados.append("email", emailRecuperacao);
        dados.append("codigo", codigo);
        dados.append("password", novaPassword);
        dados.append("confirmar_password", confirmarPassword);

        try {
            const resposta = await fetch(
                "/utilizadores/api/redefinir-password/",
                {
                    method: "POST",
                    body: dados
                }
            );

            const resultado = await lerResposta(resposta);

            mostrarMensagem(
                resultado.mensagem ||
                "Palavra-passe alterada com sucesso.",
                "sucesso"
            );

            formNovaPassword.reset();

            botaoAlterar.textContent = "Concluído";

            // Dar tempo para o utilizador ler a confirmação.
            window.setTimeout(() => {
                window.location.href = "/utilizadores/login/";
            }, 1800);

        } catch (erro) {
            mostrarMensagem(erro.message, "erro");

            botaoAlterar.disabled = false;
            botaoAlterar.textContent = "Alterar palavra-passe";
        }
    });

    botaoVoltar.addEventListener("click", () => {
        voltarEtapaEmail();
    });

    // Aceitar apenas números no campo do PIN.
    codigoInput.addEventListener("input", () => {
        codigoInput.value = codigoInput.value
            .replace(/\D/g, "")
            .slice(0, 6);
    });
</script>

</body>
</html>
