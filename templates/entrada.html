{% load static %}

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#b3daff"
    >

    <title>Entrar | Profisabores</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                180deg,
                #b3daff 0%,
                #ffffff 75%
            );
        }

        .entrada-container {
            width: 100%;
            max-width: 420px;
            padding: 35px 28px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            display: block;
            width: 85px;
            height: 85px;
            object-fit: contain;
            margin: 0 auto 16px;
        }

        h1 {
            margin: 0;
            text-align: center;
            color: #222222;
            font-size: 29px;
        }

        .subtitulo {
            margin: 10px 0 30px;
            color: #777777;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
        }

        .opcoes {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .botao-entrada {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 52px;
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            background: #8bc2f5;
            color: #173957;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .botao-entrada:hover {
            background: #72b2ed;
            transform: translateY(-1px);
        }

        .botao-entrada:focus-visible {
            outline: 3px solid #245da8;
            outline-offset: 3px;
        }

        .nota {
            margin: 24px 0 0;
            color: #777777;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 380px) {
            .entrada-container {
                padding: 28px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="entrada-container">

        <img
            class="logo"
            src="{% static 'img/rofiteclaICON.png' %}"
            alt="Logótipo do Profisabores"
        >

        <h1>Profisabores</h1>

        <p class="subtitulo">
            Bem-vindo! Escolhe como pretendes entrar.
        </p>

        <nav
            class="opcoes"
            aria-label="Opções de acesso"
        >

            <a
                class="botao-entrada"
                href="/inicio/"
            >
                Entrar como visitante
            </a>

            <a
                class="botao-entrada"
                href="/utilizadores/login/"
            >
                Entrar como aluno / STAFF
            </a>

            <a
                class="botao-entrada"
                href="/funcionarios/login/"
            >
                Área Administrativa
            </a>

        </nav>

        <p class="nota">
            Os alunos e funcionários devem utilizar
            as respetivas credenciais de acesso.
        </p>

    </main>

</body>
</html>
